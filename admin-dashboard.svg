<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" width="1100" height="620">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#070c18"/>
    </linearGradient>
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1728"/>
      <stop offset="100%" style="stop-color:#0a1220"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0f0a"/>
      <stop offset="100%" style="stop-color:#0f0a07"/>
    </linearGradient>
    <filter id="dashGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Map tile pattern simulation -->
    <pattern id="mapTiles" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#1a2a1a"/>
      <rect x="0" y="0" width="60" height="1" fill="#223322"/>
      <rect x="0" y="0" width="1" height="60" fill="#223322"/>
      <rect x="0" y="30" width="60" height="1" fill="#1d2e1d"/>
      <rect x="30" y="0" width="1" height="60" fill="#1d2e1d"/>
    </pattern>
    <!-- Chart bars gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#cc3300"/>
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect width="1100" height="620" fill="url(#dbBg)"/>

  <!-- Browser chrome -->
  <rect width="1100" height="32" fill="#111827"/>
  <circle cx="18" cy="16" r="5" fill="#ef4444"/>
  <circle cx="32" cy="16" r="5" fill="#f59e0b"/>
  <circle cx="46" cy="16" r="5" fill="#22c55e"/>
  <rect x="90" y="7" width="380" height="18" rx="9" fill="#1f2937"/>
  <text x="280" y="20" text-anchor="middle" font-family="monospace" font-size="9" fill="#4b5563">admin.roadsaathi.in/dashboard</text>

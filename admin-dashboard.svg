  <text x="315" y="118" text-anchor="middle" font-family="monospace" font-size="11" fill="#667799">Total Reports</text>
  <text x="315" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#ff6b35" font-weight="bold" filter="url(#dashGlow)">2,847</text>
  <text x="315" y="170" text-anchor="middle" font-family="monospace" font-size="9" fill="#22c55e">↑ 12% this week</text>
  <text x="315" y="184" text-anchor="middle" font-size="18" fill="#ff6b35">⚠</text>


  <text x="105" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#ff6b35" font-weight="bold" filter="url(#dashGlow)">⚠ RoadSaathi</text>
  <text x="105" y="83" text-anchor="middle" font-family="monospace" font-size="8" fill="#664422" letter-spacing="2">NHAI CONTROL PANEL</text>


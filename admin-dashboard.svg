    <text x="45" y="130" fill="#ff6b35">📊 Dashboard</text>

    <text x="45" y="163" fill="#5577aa">🗺  Live Map</text>
    <text x="45" y="196" fill="#5577aa">📋 Triage Queue</text>
    <text x="45" y="229" fill="#5577aa">📌 Status Board</text>
    <text x="45" y="262" fill="#5577aa">📈 Analytics</text>

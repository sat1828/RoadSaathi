server:
  port: ${PORT:8080}

spring:
  application:
    name: roadsaathi-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roadsaathi}
    username: ${DB_USERNAME:roadsaathi}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
    refresh-expiration-ms: 2592000000

  s3:
    region: ${AWS_REGION:ap-south-1}
    bucket: ${S3_BUCKET:roadsaathi-uploads}
    presigned-url-expiry-minutes: 15

  claude:
    api-key: ${CLAUDE_API_KEY}
    api-url: https://api.anthropic.com/v1/messages
    model: claude-3-5-sonnet-20241022
    max-tokens: 100

  firebase:
    config-path: classpath:firebase-service-account.json

  rate-limit:
    reports-per-hour: 10

  expiry:
    report-ttl-hours: 48
    confirmation-extension-hours: 24
    driver-session-timeout-minutes: 60

logging:
  level:
    com.roadsaathi: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roadsaathi_test}
    username: ${DB_USERNAME:roadsaathi}
    password: ${DB_PASSWORD}

version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: roadsaathi-db
    environment:
      POSTGRES_DB: ${DB_NAME:-roadsaathi}
      POSTGRES_USER: ${DB_USERNAME:-roadsaathi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-roadsaathi_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-roadsaathi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadsaathi-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-roadsaathi}
      DB_USERNAME: ${DB_USERNAME:-roadsaathi}
      DB_PASSWORD: ${DB_PASSWORD:-roadsaathi_secret}
      JWT_SECRET: ${JWT_SECRET}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-roadsaathi-uploads}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: roadsaathi-admin
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
